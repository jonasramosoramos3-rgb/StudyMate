<!DOCTYPE html>
<html><body style="font-family:sans-serif; padding:40px; text-align:center">
<h2>FinanceFlow - Click to Download</h2>
<button onclick="download()" style="padding:16px 32px; background:#0f172a; color:white; border-radius:999px; border:0; font-weight:bold; font-size:18px; cursor:pointer">⬇️ DOWNLOAD FinanceFlow-Single-File.html (100KB)</button>
<p id="status" style="margin-top:20px; color:#64748b"></p>
<script>
async function download(){
  document.getElementById('status').textContent='Downloading...';
  try{
    const res = await fetch('./FinanceFlow-Single-File.html');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    a.click();
    document.getElementById('status').textContent='Downloaded! Save as index.html and upload to GitHub';
  }catch(e){
    document.getElementById('status').textContent='Error: '+e.message+' - Try right-click preview -> Save As';
  }
}
</script>
</body></html>
